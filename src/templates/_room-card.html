<article class="card group flex flex-col">
  <a href="{{href}}" class="block aspect-[4/3] overflow-hidden">
    <img src="{{image}}" alt="{{imageAlt}}" loading="lazy" decoding="async"
         class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" />
  </a>
  <div class="p-7 flex flex-col gap-3 flex-1">
    <div class="eyebrow">{{eyebrow}}</div>
    <h3 class="text-2xl">{{title}}</h3>
    <p class="text-ink-muted flex-1">{{description}}</p>
    <ul class="flex flex-wrap gap-x-4 gap-y-1 text-sm text-ink-muted">
      {{features}}
    </ul>
    <a href="{{href}}" class="mt-3 inline-flex items-center gap-2 text-sm font-semibold uppercase tracking-wideish text-accent-hover hover:text-ink">
      {{cta}}
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M13 5l7 7-7 7"/>
      </svg>
    </a>
  </div>
</article>
